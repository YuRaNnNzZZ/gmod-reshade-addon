name: Build and package

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure x86
        run: cmake -S . -B build-x86 -A Win32

      - name: Build x86
        run: cmake --build build-x86 --config Release --parallel

      - name: Configure x64
        run: cmake -S . -B build-x64 -A x64

      - name: Build x64
        run: cmake --build build-x64 --config Release --parallel

      - name: Create package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $binaryStage = Join-Path $PWD "package/binary-root"
          $addonStage = Join-Path $PWD "package/addon-root"
          $addon = Join-Path $addonStage "pp_reshade"

          New-Item -ItemType Directory -Path (Join-Path $binaryStage "bin/win64") -Force | Out-Null
          New-Item -ItemType Directory -Path $addon -Force | Out-Null

          Copy-Item -LiteralPath "build-x86/Release/gmod_reshade.addon32" -Destination (Join-Path $binaryStage "bin/gmod_reshade.addon32")
          Copy-Item -LiteralPath "build-x64/Release/gmod_reshade.addon64" -Destination (Join-Path $binaryStage "bin/win64/gmod_reshade.addon64")
          Copy-Item -Path "addons/pp_reshade/*" -Destination $addon -Recurse

          Compress-Archive -Path (Join-Path $binaryStage "*") -DestinationPath "package/gmod-reshade.zip"
          Compress-Archive -Path (Join-Path $addonStage "*") -DestinationPath "package/pp_reshade.zip"

      - name: Upload binary package
        uses: actions/upload-artifact@v7
        with:
          path: package/gmod-reshade.zip
          if-no-files-found: error
          archive: false

      - name: Upload Lua add-on package
        uses: actions/upload-artifact@v7
        with:
          path: package/pp_reshade.zip
          if-no-files-found: error
          archive: false

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: gmod-reshade.zip
          path: release
          skip-decompress: true

      - name: Download Lua add-on package
        uses: actions/download-artifact@v8
        with:
          name: pp_reshade.zip
          path: release
          skip-decompress: true

      - name: Create checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = @("gmod-reshade.zip", "pp_reshade.zip")
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath "release/$file" -Algorithm SHA256).Hash
            "$hash  $file"
          }

          $checksums | Set-Content -LiteralPath "release/SHA256SUMS.txt" -Encoding ascii
          $summary = "Package SHA-256 checksums:`n" + ($checksums -join "`n")
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $commitUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA"
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = "Built from commit [$env:GITHUB_SHA]($commitUrl) by [workflow run $env:GITHUB_RUN_ID]($runUrl)."

          gh release create $env:GITHUB_REF_NAME `
            "release/gmod-reshade.zip#ReShade add-on" `
            "release/pp_reshade.zip#Integration addon" `
            "release/SHA256SUMS.txt#SHA-256 checksums" `
            --verify-tag `
            --generate-notes `
            --title $env:GITHUB_REF_NAME `
            --notes $notes
